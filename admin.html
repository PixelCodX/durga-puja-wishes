<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Navro Admin Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f4f5f7;
      color: #222;
    }

    .container {
      max-width: 850px;
      margin: 40px auto;
    }

    .card {
      background: white;
      padding: 24px;
      margin-bottom: 20px;
      border-radius: 14px;
      box-shadow: 0 4px 18px #0000000d;
    }

    h1, h2 {
      margin-top: 0;
    }

    input, button {
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      border-radius: 8px;
      font-size: 16px;
    }

    input {
      border: 1px solid #ccc;
    }

    button {
      border: none;
      background: #222;
      color: white;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #message {
      margin-top: 15px;
      overflow-wrap: anywhere;
      line-height: 1.5;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 14px;
    }

    .stat {
      background: #f7f7f7;
      padding: 20px;
      border-radius: 10px;
    }

    .number {
      font-size: 28px;
      font-weight: bold;
      margin-top: 10px;
    }

    .hidden {
      display: none;
    }

    .small {
      color: #666;
      font-size: 13px;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Navro Admin</h1>

    <div class="card" id="loginCard">
      <h2>Admin Login</h2>

      <form id="loginForm">
        <input
          type="email"
          id="email"
          placeholder="Admin email"
          autocomplete="username"
          required
        />

        <input
          type="password"
          id="password"
          placeholder="Password"
          autocomplete="current-password"
          required
        />

        <button type="submit" id="loginButton">Login</button>
      </form>

      <div id="message" role="status"></div>

      <p class="small">
        Login with the account registered in this Supabase project
        and authorized for the admin dashboard.
      </p>
    </div>

    <div class="card hidden" id="dashboard">
      <h2>Website Statistics</h2>

      <div class="stats">
        <div class="stat">
          Total Visits
          <div class="number" id="totalVisits">—</div>
        </div>

        <div class="stat">
          Total Greetings Created
          <div class="number" id="totalWishes">—</div>
        </div>

        <div class="stat">
          Visits Today
          <div class="number" id="todayVisits">—</div>
        </div>

        <div class="stat">
          Greetings Today
          <div class="number" id="todayWishes">—</div>
        </div>

        <div class="stat">
          Visits — Last 7 Days
          <div class="number" id="weekVisits">—</div>
        </div>

        <div class="stat">
          Greetings — Last 7 Days
          <div class="number" id="weekWishes">—</div>
        </div>
      </div>

      <button id="refreshButton">Refresh Statistics</button>
      <button id="logoutButton">Logout</button>

      <div id="statsMessage" role="status"></div>
    </div>
  </div>

  <script>
    const SUPABASE_URL =
      "https://iqzzqpgtjvnzjuikrxjd.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_PHpSZmbegb7KA_zeCE27Eg_YyIrnTdM";

    const client = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const loginCard = document.getElementById("loginCard");
    const dashboard = document.getElementById("dashboard");
    const message = document.getElementById("message");
    const statsMessage = document.getElementById("statsMessage");
    const loginButton = document.getElementById("loginButton");

    function showMessage(text) {
      message.textContent = text;
    }

    function showDashboard() {
      loginCard.classList.add("hidden");
      dashboard.classList.remove("hidden");
    }

    function showLogin() {
      dashboard.classList.add("hidden");
      loginCard.classList.remove("hidden");
    }

    document
      .getElementById("loginForm")
      .addEventListener("submit", async function (event) {
        event.preventDefault();

        loginButton.disabled = true;
        showMessage("Logging in...");

        try {
          const email = document.getElementById("email").value.trim();
          const password = document.getElementById("password").value;

          const { data, error } = await client.auth.signInWithPassword({
            email,
            password
          });

          if (error) {
            showMessage(
              "Login failed: " + error.message
            );
            return;
          }

          if (!data.session) {
            showMessage("Login failed: No session returned.");
            return;
          }

          showMessage("");
          showDashboard();
          await loadStats(data.session);
        } catch (error) {
          showMessage("Error: " + error.message);
        } finally {
          loginButton.disabled = false;
        }
      });

    async function loadStats(existingSession = null) {
      statsMessage.textContent = "Loading statistics...";

      try {
        let session = existingSession;

        if (!session) {
          const { data, error } = await client.auth.getSession();

          if (error) throw error;

          session = data.session;
        }

        if (!session) {
          showLogin();
          showMessage("Please log in again.");
          return;
        }

        const response = await fetch(
          SUPABASE_URL + "/functions/v1/analytics-stats",
          {
            method: "GET",
            headers: {
              "apikey": SUPABASE_PUBLISHABLE_KEY,
              "Authorization": "Bearer " + session.access_token
            }
          }
        );

        const result = await response.json();

        if (!response.ok) {
          throw new Error(
            result.error ||
            result.message ||
            "Statistics request failed (" + response.status + ")."
          );
        }

        document.getElementById("totalVisits").textContent =
          result.total_visits ?? 0;

        document.getElementById("totalWishes").textContent =
          result.total_wishes ?? 0;

        document.getElementById("todayVisits").textContent =
          result.today_visits ?? 0;

        document.getElementById("todayWishes").textContent =
          result.today_wishes ?? 0;

        document.getElementById("weekVisits").textContent =
          result.week_visits ?? 0;

        document.getElementById("weekWishes").textContent =
          result.week_wishes ?? 0;

        statsMessage.textContent = "";
      } catch (error) {
        statsMessage.textContent =
          "Could not load statistics: " + error.message;
      }
    }

    document
      .getElementById("refreshButton")
      .addEventListener("click", () => loadStats());

    document
      .getElementById("logoutButton")
      .addEventListener("click", async () => {
        await client.auth.signOut();
        showLogin();
        showMessage("Logged out.");
        statsMessage.textContent = "";
      });

    async function checkExistingSession() {
      try {
        const { data, error } = await client.auth.getSession();

        if (error) throw error;

        if (data.session) {
          showDashboard();
          await loadStats(data.session);
        }
      } catch (error) {
        showMessage("Setup error: " + error.message);
      }
    }

    checkExistingSession();
  </script>
</body>
        </html>
